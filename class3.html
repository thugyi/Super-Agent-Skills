<!DOCTYPE html>
<html>
    <head>
        <title>
            Vue js Data Binding
        </title>
        <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
    </head>
    <body>
        <div id="app">
            <a v-bind:href="address"> Click Here </a>
            <h1 :class="classes"> Hello World </h1>
            <input type="text" v-bind:value="name">
        </div>

    <script>
        var app = new Vue ({
            el: '#app',
            data:{
                address: 'https://vuejs.org/',
                classes: ['one', 'two'],
                name: 'Lucifer'
            },

        })
    </script>
    </body>
</html>
