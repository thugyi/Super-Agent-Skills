<!DOCTYPE html>
<html>
    <head>
        <title>
            Vue js Project
        </title>
        <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
    </head>
    <body>
        <div id="app">
            <h1> I earn {{dollar}}$ per Month</h1>
            <button @click="Amount(1)"> +1 </button>
            <button @click="Amount(-1)"> -1 </button>
        </div>

    <script>
        var app = new Vue ({
            el: "#app",
            data:{
                dollar:100
            },
        methods:{
            Amount(pound){
                this.dollar += pound
            }
        },
        })
    </script>
    </body>
</html>
