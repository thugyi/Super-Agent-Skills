<!DOCTYPE html>
<html>
    <head>
        <title>
            Vue js Methods
        </title>
        <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
    </head>
    <body>
        <div id="app">
            <h1>{{ MyName() }}</h1>
            <h1>{{ Myage() }}</h1>
        </div>

    <script>
        var app = new Vue ({
            el: '#app',
            data:{
                name: 'Welcome Guy!!'
            },
        methods:{
            MyName(){
                return 'easy Learning Methods'
            },
            Myage(){
                return `${this.name}`
            }
        }

        })
    </script>
    </body>
</html>
